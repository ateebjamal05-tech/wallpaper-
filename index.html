l<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        .thought-container { text-align: center; width: 85%; margin-bottom: 20px; }
        .cursive-text {
            font-family: 'cursive', sans-serif;
            font-size: 1.4rem;
            background: linear-gradient(to right, #ff3333, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Time Style */
        #liveClock {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 5px; /* Less space between time and date */
            letter-spacing: -2px;
            line-height: 1;
        }

        /* Date Style */
        #dateDisplay {
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(14, 16px);
            gap: 6px;
            justify-content: center;
        }
        .dot { width: 12px; height: 12px; border-radius: 3px; }
        .white-dot { background-color: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        .red-dot { background-color: #1a0000; border: 1px solid #ff3333; }
        
        .label {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="thought-container">
        <div class="cursive-text">Just believe in yourself and just do it</div>
    </div>

    <div id="liveClock">00:00</div>
    <div id="dateDisplay">Loading...</div>

    <div id="calendarGrid" class="grid"></div>
    <div class="label" id="dayCounter">Calculating...</div>

    <script>
        function updateWallpaper() {
            const now = new Date();
            
            // 1. Update Time
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('liveClock').innerText = `${h}:${m}`;

            // 2. Update Date (e.g., THU, FEB 12)
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', options).toUpperCase();
            document.getElementById('dateDisplay').innerText = dateString;

            // 3. Update Calendar
            const grid = document.getElementById('calendarGrid');
            const counterLabel = document.getElementById('dayCounter');
            
            // TARGET DATES: Adjust these if you need a different timeline
            const startDate = new Date("2026-02-12"); 
            const targetDate = new Date("2027-01-21");

            const totalDays = Math.ceil((targetDate - startDate) / (1000 * 60 * 60 * 24));
            const daysPassed = Math.floor((now - startDate) / (1000 * 60 * 60 * 24)) + 1;

            if (grid.dataset.lastDay !== String(daysPassed)) {
                grid.innerHTML = ''; 
                for (let i = 0; i < totalDays; i++) {
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    if (i < daysPassed) { dot.classList.add('white-dot'); } 
                    else { dot.classList.add('red-dot'); }
                    grid.appendChild(dot);
                }
                grid.dataset.lastDay = daysPassed;
            }

            const remaining = totalDays - daysPassed;
            counterLabel.innerText = remaining > 0 ? remaining + " Days Remaining" : "Goal Reached";
        }

        setInterval(updateWallpaper, 1000);
        updateWallpaper();
    </script>
</body>
</html>
